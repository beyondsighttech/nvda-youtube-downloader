name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check add-on sources
        run: python -m compileall globalPlugins build_addon.py

      - name: Validate manifest and packaging
        run: python build_addon.py --check

      - name: Run tests
        run: python test_addon.py

      - name: Build add-on package
        run: python build_addon.py

      - uses: actions/upload-artifact@v4
        with:
          name: nvda-addon
          path: dist/*.nvda-addon
          if-no-files-found: error
