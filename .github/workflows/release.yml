name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for the changelog link

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tag matches manifest version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python build_addon.py --print-version)"
          echo "Tag: $TAG_VERSION | Manifest: $MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match manifest.ini version $MANIFEST_VERSION. Fix one of them and re-tag."
            exit 1
          fi

      - name: Validate manifest and packaging
        run: python build_addon.py --check

      - name: Run tests
        run: python test_addon.py

      - name: Build add-on package
        run: python build_addon.py

      - name: Compute SHA-256
        shell: bash
        run: |
          cd dist
          for f in *.nvda-addon; do
            sha256sum "$f" > "$f.sha256"
            sha256sum -c "$f.sha256"
          done

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG="$(git tag --sort=-creatordate | grep -vx "$GITHUB_REF_NAME" | head -1 || true)"
          CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$'\n'"**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"$'\n'
          fi
          NOTES=$(cat <<EOF
          ## Install

          1. Download \`youtubeDownloader-${VERSION}.nvda-addon\` below.
          2. Open the downloaded file to install it in NVDA.
          3. Restart NVDA when prompted.

          \`yt-dlp\` and FFmpeg are downloaded automatically the first time you
          start a download - no manual setup is required.

          ## Verify checksum

          \`\`\`
          sha256sum -c youtubeDownloader-${VERSION}.nvda-addon.sha256
          \`\`\`
          ${CHANGELOG}
          EOF
          )
          gh release create "$GITHUB_REF_NAME" \
            --title "youtubeDownloader ${VERSION}" \
            --notes "$NOTES" \
            dist/*
